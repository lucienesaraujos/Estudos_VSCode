<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Condicionais</title>
</head>
<body>
    <h1>Sistema de multas</h1>
    Velocidade do carro: <input type="number" name="velocidade" id="velocidade">
    <input type="button" value="Verificar" onclick="calcular()">
    <div id="resultado">Resultado</div>
    <script>
        function calcular(){
            var verificacao = window.document.getElementById('velocidade')
            var resultado = window.document.querySelector('div#resultado')
            var status = Number.parseFloat(verificacao.value)
            resultado.innerHTML = `<p>Sua velocidade atual é <strong>${status}Km/h</strong></p>`
            if(status>60){
            resultado.innerHTML += `<p>Você está <strong>MULTADO</strong>por excesso de velocidade`
            }
            resultado.innerHTML += `<p>Dirija sempre com cinto de segurança</p>`
        }
    </script>

</body>
</html>
