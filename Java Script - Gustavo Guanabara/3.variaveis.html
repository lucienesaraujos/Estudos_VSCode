<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu primeiro programa</title>
    <style>
    body {
       background-color: rgba(210, 219, 216, 0.774); color: rgba(24, 70, 10, 0.644); font: normal 50pt comic;
    }
    h1{
        color:rgba(24, 70, 10, 0.973)
    }
    </style>
</head>
<body>
   <h1> Hello, world! </h1> 
   <p>Nesse ritmo tá complicado... </p>
   <script>
   
    var numero1 = Number.parseInt(window.prompt("Digite um número: "))
    var numero2 = Number.parseFloat(window.prompt("Digite outro número: "))
    var soma = numero1 + numero2
    window.alert (`A soma de ${numero1} + ${numero2} é igual a: ${soma}`)



   </script>
</body>
</html>
