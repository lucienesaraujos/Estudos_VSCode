<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operações</title>
    <style>
    body {
    font: normal 20pt Times;
    }
    </style>
</head>
<body>
    <script>
    numero1 = 5
    numero2 = 2

    soma = numero1 + numero2
    subtracao = numero1 - numero2
    resto = numero1 % numero2
    divisao = numero1 / numero2
    multiplicao = numero1 * numero2
    potencia = numero1 ** numero2
    pre_incremento = ++numero1
    pre_decremento = --numero2
    pos_incremento = numero1++
    pos_decremento = numero2--
    // = atribui valor
    // == igual a
    // === igualdade restrita, mesmo valor e tipo
    // !== desigual restrito
    maior = numero1 > numero2
    menor = numero1 < numero2
    maior ou igual = numero1 >= numero2
    menor ou igual = numero1 <= numero2
    igual = numero1 == numero2
    diferente = numero1 != numero2
    // ! = negação 
    // && = conjunção, a e b = verdadeiro
    // || = disjunção, a ou b = verdadeiro
    ternario = numero1 > numero2 ? 1:0 // ou 'Maior':'Menor' ou 1 verdadeiro 0 falso
    
    </script>
</body>
</html>
